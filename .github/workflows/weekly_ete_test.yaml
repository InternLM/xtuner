name: weekly ete test
run-name: weekly-ete-test-${{ github.event.inputs.run_case || 'all' }}

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      repo_org:
        required: false
        description: 'Tested repository organization name. Default is InternLM/xtuner'
        type: string
        default: 'InternLM/xtuner'
      repo_ref:
        required: false
        description: 'Branch, tag, or commit to build the image from and run ETE against. Default is main'
        type: string
        default: 'main'
      torch_version:
        required: true
        description: 'Docker torch version. Default is 2.9.1'
        type: string
        default: '2.9.1'
      image_repo_short:
        required: true
        description: 'Docker image repository short name under ailab-llmrazor/. Default is xtuner'
        type: choice
        options:
          - xtuner
          - xtuner_tmp
        default: 'xtuner'
      image_tag:
        required: false
        description: >-
          Docker image tag. Default is auto (pt{torch}_{YYYYMMDD}_{commit}).
          Required when skip_build is true.
        type: string
        default: 'auto'
      skip_build:
        required: false
        description: 'Skip image build and run ETE with image_tag on the cluster registry'
        type: boolean
        default: false
      build_only:
        required: false
        description: 'Only build and push the docker image, do not run ETE'
        type: boolean
        default: false
      run_case:
        required: false
        description: >-
          Case name(s) from autotest/config.yaml. Use "all" for every case,
          one name (e.g. "qwen3-rl-lmdeploy"), or comma-separated names.
        type: string
        default: 'all'
      parallel:
        required: false
        description: >-
          pytest-xdist worker count (-n). Use a number (e.g. 4), or "all"
          for one worker per selected case.
        type: string
        default: '4'
      CI_E2E_DEBUG:
        required: false
        description: >-
          If true, keep the cluster job alive after install for interactive debug.
        type: boolean
        default: false
      clusterx_partition:
        required: false
        description: >-
          clusterx partition (yidian group), e.g. llmrazor_gpu.
          Empty uses config.yaml default.
        type: string
        default: ''
      clusterx_project_name:
        required: false
        description: >-
          clusterx project namespace, e.g. ailab-llmrazor.
          Empty uses config.yaml default.
        type: string
        default: ''
      skip_xtuner_install:
        required: false
        description: >-
          If true, skip ``pip install -e .`` in train jobs (use when the image
          already contains a preinstalled xtuner).
        type: boolean
        default: false
  schedule:
    - cron: '0 9 * * 5'  # Friday 17:00 UTC+8

env:
  CI_GPU_IMAGE_REGISTRY: ${{ secrets.CI_GPU_IMAGE_REGISTRY }}
  CI_REPORTS_REPOSITORY: ${{ vars.CI_REPORTS_REPOSITORY || 'llmcitester/xtuner' }}
  CI_REPORTS_BRANCH: ${{ vars.CI_REPORTS_BRANCH || 'reports' }}
  CI_REPORTS_RAW_URL_BASE: ${{ vars.CI_REPORTS_RAW_URL_BASE || 'https://raw.githubusercontent.com/llmcitester/xtuner/reports/ete' }}
  CI_REPORTS_BROWSE_URL_BASE: ${{ vars.CI_REPORTS_BROWSE_URL_BASE || 'https://github.com/llmcitester/xtuner/tree/reports/ete' }}
  CI_REPORTS_KEEP_RUNS: ${{ vars.CI_REPORTS_KEEP_RUNS || '30' }}

jobs:
  build_image:
    if: ${{ !inputs.skip_build }}
    runs-on: [docker-inner]
    outputs:
      image_tag: ${{ steps.parse_tag.outputs.image_tag }}
      docker_tag: ${{ steps.parse_tag.outputs.docker_tag }}
      short_docker_tag: ${{ steps.parse_tag.outputs.short_docker_tag }}
    env:
      IMAGE_NAME: ailab-llmrazor/${{ inputs.image_repo_short || 'xtuner' }}
      IMAGE_TAG: ${{ inputs.image_tag || 'auto' }}
      TORCH_VERSION: ${{ inputs.torch_version || '2.9.1' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.repo_ref || 'main' }}

      - name: Parse tag
        id: parse_tag
        run: |
          if [[ "${IMAGE_TAG}" == 'auto' ]]; then
            DATE_TODAY="$(date +'%Y%m%d')"
            COMMIT_SHA="$(git rev-parse --short HEAD)"
            IMAGE_TAG="pt$(echo "${TORCH_VERSION}" | awk -F. '{print $1$2}')_${DATE_TODAY}_${COMMIT_SHA}"
          fi
          DOCKER_TAG="${{ secrets.CI_GPU_IMAGE_REGISTRY }}/${IMAGE_NAME}:${IMAGE_TAG}"
          SHORT_DOCKER_TAG="${IMAGE_NAME}:${IMAGE_TAG}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "docker_tag=${DOCKER_TAG}" >> "$GITHUB_OUTPUT"
          echo "short_docker_tag=${SHORT_DOCKER_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          cat "${{ vars.EXTRA_DOCKERFILE }}" >> "${{ github.workspace }}/Dockerfile"
          echo "IMAGE_NAME: ${IMAGE_NAME}, IMAGE_TAG: ${IMAGE_TAG}"
          export IMAGE_NAME="${{ secrets.CI_GPU_IMAGE_REGISTRY }}/${IMAGE_NAME}"
          bash "${{ github.workspace }}/image_build.sh"
          echo "Built image with tag: ${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Push to cluster registry
        run: |
          echo "pushing ${IMAGE_NAME}:${IMAGE_TAG} ..."
          docker login "${{ secrets.CI_GPU_IMAGE_REGISTRY }}" \
            -p "${{ secrets.CLUSTER_DOCKERHUB_TOKEN }}" \
            -u "${{ secrets.CLUSTER_DOCKERHUB_USERNAME }}"
          docker push "${{ secrets.CI_GPU_IMAGE_REGISTRY }}/${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Publish build summary
        run: |
          {
            echo "## Docker image built"
            echo ""
            echo "- Image tag: \`${{ steps.parse_tag.outputs.short_docker_tag }}\`"
            echo "- Full reference: \`${{ steps.parse_tag.outputs.docker_tag }}\`"
            echo "- Commit: \`$(git rev-parse --short HEAD)\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  ete_test:
    needs: build_image
    if: >-
      ${{
        !cancelled() &&
        !inputs.build_only &&
        (needs.build_image.result == 'success' || inputs.skip_build)
      }}
    runs-on: [h_cluster_ete]
    timeout-minutes: 1440
    env:
      CI_ETE_TRAIN_IMAGE: >-
        ${{
          inputs.skip_build
          && format(
            'ailab-llmrazor/{0}:{1}',
            inputs.image_repo_short || 'xtuner',
            inputs.image_tag
          )
          || needs.build_image.outputs.short_docker_tag
        }}
      CI_ETE_CLUSTERX_PARTITION: ${{ github.event.inputs.clusterx_partition }}
      CI_ETE_CLUSTERX_PROJECT_NAME: ${{ github.event.inputs.clusterx_project_name }}
      CI_ETE_SKIP_XTUNER_INSTALL: ${{ github.event.inputs.skip_xtuner_install }}
    steps:
      - name: Validate inputs
        if: ${{ inputs.skip_build }}
        run: |
          if [ "${{ inputs.image_tag }}" = "auto" ] || [ -z "${{ inputs.image_tag }}" ]; then
            echo "image_tag must be a concrete tag when skip_build is true (not 'auto')"
            exit 1
          fi

      - name: Clean workdir
        run: sudo git clean -ffdx

      - name: Clone repository
        uses: actions/checkout@v2
        with:
          repository: ${{ github.event.inputs.repo_org || 'InternLM/xtuner' }}
          ref: ${{ github.event.inputs.repo_ref || 'main' }}

      - name: Init job summary
        run: |
          {
            echo "## Weekly ETE test report"
            echo ""
            echo "- Workflow run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "- Train image: \`${{ env.CI_ETE_TRAIN_IMAGE }}\`"
            echo "- clusterx partition: \`${{ env.CI_ETE_CLUSTERX_PARTITION || 'llmrazor_gpu (config default)' }}\`"
            echo "- clusterx project: \`${{ env.CI_ETE_CLUSTERX_PROJECT_NAME || 'ailab-llmrazor (config default)' }}\`"
            echo "- skip xtuner install: \`${{ env.CI_ETE_SKIP_XTUNER_INSTALL }}\`"
            echo "- Reports: [ete/${{ github.run_id }}](${{ env.CI_REPORTS_BROWSE_URL_BASE }}/${{ github.run_id }})"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: run-test
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          CI_REPORTS_RAW_URL_BASE: ${{ env.CI_REPORTS_RAW_URL_BASE }}
          CI_E2E_DEBUG: ${{ github.event.inputs.CI_E2E_DEBUG || 'false' }}
          CI_ETE_TRAIN_IMAGE: ${{ env.CI_ETE_TRAIN_IMAGE }}
          CI_ETE_CLUSTERX_PARTITION: ${{ env.CI_ETE_CLUSTERX_PARTITION }}
          CI_ETE_CLUSTERX_PROJECT_NAME: ${{ env.CI_ETE_CLUSTERX_PROJECT_NAME }}
          CI_ETE_SKIP_XTUNER_INSTALL: ${{ env.CI_ETE_SKIP_XTUNER_INSTALL }}
        run: |
          source /mnt/shared-storage-user/opencompass-shared/qa-llm-cicd/miniconda3/bin/activate
          conda activate clusterx
          conda env list
          unset HTTP_PROXY HTTPS_PROXY http_proxy https_proxy
          echo "Using train image: ${CI_ETE_TRAIN_IMAGE}"
          echo "clusterx partition: ${CI_ETE_CLUSTERX_PARTITION:-llmrazor_gpu (config default)}"
          echo "clusterx project: ${CI_ETE_CLUSTERX_PROJECT_NAME:-ailab-llmrazor (config default)}"
          echo "skip xtuner install: ${CI_ETE_SKIP_XTUNER_INSTALL:-false}"
          CASE_INPUT="${{ github.event.inputs.run_case || 'all' }}"
          PARALLEL_INPUT="${{ github.event.inputs.parallel || '4' }}"
          PYTEST_NODES=()
          if [ "$CASE_INPUT" = "all" ]; then
            mapfile -t CASE_NAMES < <(python -c 'import yaml; cfg=yaml.safe_load(open("autotest/config.yaml",encoding="utf-8")); print("\n".join(cfg["case"]))')
            for case_name in "${CASE_NAMES[@]}"; do
              [ -z "$case_name" ] && continue
              PYTEST_NODES+=("autotest/test_all.py::test_all[${case_name}]")
            done
          else
            IFS=',' read -ra RAW_CASES <<< "$CASE_INPUT"
            for raw in "${RAW_CASES[@]}"; do
              case_name="$(echo "$raw" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
              [ -z "$case_name" ] && continue
              PYTEST_NODES+=("autotest/test_all.py::test_all[${case_name}]")
            done
          fi
          if [ "${#PYTEST_NODES[@]}" -eq 0 ]; then
            echo "No valid case names parsed from run_case='${CASE_INPUT}'"
            exit 1
          fi
          CASE_COUNT="${#PYTEST_NODES[@]}"
          if [ "$PARALLEL_INPUT" = "all" ]; then
            PARALLEL="$CASE_COUNT"
          elif [[ "$PARALLEL_INPUT" =~ ^[1-9][0-9]*$ ]]; then
            PARALLEL="$PARALLEL_INPUT"
          else
            echo "Invalid parallel='${PARALLEL_INPUT}', fallback to 4"
            PARALLEL=4
          fi
          if [ "$PARALLEL" -gt "$CASE_COUNT" ]; then
            PARALLEL="$CASE_COUNT"
          fi
          echo "Running ${CASE_COUNT} case(s) with pytest-xdist -n ${PARALLEL}"
          echo "Cases: ${PYTEST_NODES[*]}"
          pytest "${PYTEST_NODES[@]}" -m all -n "${PARALLEL}" -s -vv --run_id "${{ github.run_id }}"

      - name: Check report files
        if: always()
        id: reports
        run: |
          REPORT_DIR="${{ github.workspace }}/${{ github.run_id }}"
          if compgen -G "${REPORT_DIR}/*.png" > /dev/null; then
            echo "has_reports=true" >> "$GITHUB_OUTPUT"
            echo "Found $(ls -1 "${REPORT_DIR}"/*.png | wc -l) comparison plot(s)."
          else
            echo "has_reports=false" >> "$GITHUB_OUTPUT"
            echo "No comparison plots found under ${REPORT_DIR}, skip publish steps."
          fi

      - name: Upload comparison plots
        if: always() && steps.reports.outputs.has_reports == 'true'
        uses: actions/upload-artifact@v4
        with:
          path: ${{ github.workspace }}/${{ github.run_id }}/*.png
          if-no-files-found: error
          retention-days: 7
          name: xtuner-ete-${{ github.run_id }}

      - name: Publish and prune ete reports
        if: always() && steps.reports.outputs.has_reports == 'true'
        env:
          GH_TOKEN: ${{ secrets.CI_REPORTS_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ env.CI_REPORTS_REPOSITORY }}"
          BRANCH="${{ env.CI_REPORTS_BRANCH }}"
          KEEP="${{ env.CI_REPORTS_KEEP_RUNS }}"
          SRC="${{ github.workspace }}/${{ github.run_id }}"
          DEST="ete/${{ github.run_id }}"
          git clone --depth=1 -b "${BRANCH}" "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" pages
          cd pages
          rm -rf "${DEST}"
          mkdir -p "$(dirname "${DEST}")"
          cp -r "${SRC}" "${DEST}"
          if [ -d ete ]; then
            cd ete
            mapfile -t RUN_DIRS < <(find . -maxdepth 1 -type d -regextype posix-egrep -regex './[0-9]+' -printf '%f\n' | sort -rn)
            if [ "${#RUN_DIRS[@]}" -gt "${KEEP}" ]; then
              for old_run in "${RUN_DIRS[@]:KEEP}"; do
                rm -rf "${old_run}"
                echo "Removed old report: ${old_run}"
              done
            fi
            cd ..
          fi
          git add -A
          if git diff --staged --quiet; then
            echo "No report changes to commit."
          else
            git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: publish ete report ${{ github.run_id }}, keep latest ${KEEP} runs"
            git push
          fi
