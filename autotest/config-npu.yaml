    intern-s2-preview-sft:
        -
            type: sft
            parameters:
                config: autotest/config/npu_interns2_preview.py
                output_path: /mnt/hwfile/llmrazor/qa-llm-cicd/test_output
            resource:
                image: ccr-hw/910c:cann852-qwen35-0610
                pip_package: cd /mnt/hwfile/llmrazor/qa-llm-cicd/wmk/fork4_xtuner/xtuner; pip install -e . --no-deps; pip install more-itertools
                num_nodes: 1
                envs:
                    - MODEL_PATH=/mnt/hwfile/llmrazor/qa-llm-cicd/qa_test_models/internlm/Intern-S2-Preview
                    - DATA_PATH=/mnt/hwfile/llmrazor/qa-llm-cicd/xtuner_resource/datasets/alpaca
                    - LD_LIBRARY_PATH="/usr/local/Ascend/driver/lib64:/usr/local/Ascend/driver/lib64/driver:/usr/local/Ascend/driver/lib64/common:/usr/local/Ascend/ascend-toolkit/latest/opp/vendors/custom_transformer/op_api/lib:${LD_LIBRARY_PATH}"
                    - XTUNER_DETERMINISTIC=true
                    - TORCH_NPU_USE_HCCL=1
                    - PYTORCH_NPU_ALLOC_CONF=expandable_segments:True,segment_size_mb:128
                    - TRITON_ALL_BLOCKS_PARALLEL=1
                    - MULTI_STREAM_MEMORY_REUSE=2
                    - XTUNER_ACTIVATION_OFFLOAD=1
                    - PIP_INDEX_URL=http://pkg.pjlab.org.cn/repository/pypi-tsinghua/simple
                    - PIP_TRUSTED_HOST=pkg.pjlab.org.cn
            assert_info:
                base_metric: npu-interns2-preview-sft/tracker.jsonl
                check_metrics:
                    grad_norm: 0.000001
                    loss/reduced_llm_loss: 0.000001
                    lr: 0
                    memory/max_memory_GB: 0.2
                    runtime_info/tgs: 0.05
                    runtime_info/text_tokens: 0
